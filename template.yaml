AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Zoolanding generic per-draft data spaces

Parameters:
  EnvironmentName:
    Type: String
    AllowedValues:
      - test
      - production
  ConfigRegistryTableName:
    Type: AWS::SSM::Parameter::Value<String>
  ConfigPayloadsBucketName:
    Type: AWS::SSM::Parameter::Value<String>
  AuthSessionTableName:
    Type: AWS::SSM::Parameter::Value<String>
  AuthUserStateTableName:
    Type: AWS::SSM::Parameter::Value<String>
  InternalSnapshotCallerRoleArn:
    Type: String
    Default: ''
    AllowedPattern: ^$|^arn:(aws|aws-us-gov|aws-cn):iam::[0-9]{12}:role/[A-Za-z0-9+=,.@_/-]+$
  AlarmTopicArn:
    Type: String
    AllowedPattern: ^arn:(aws|aws-us-gov|aws-cn):sns:[a-z0-9-]+:[0-9]{12}:[A-Za-z0-9_.-]+$

Globals:
  Function:
    Runtime: python3.13
    Timeout: 10
    MemorySize: 256
    Tracing: PassThrough
    Tags:
      Project: Zoolandingpage
      Component: DataSpaces
      ManagedBy: SAM
      Environment:
        Ref: EnvironmentName

Resources:
  DataSpacesApi:
    Type: AWS::Serverless::Api
    Properties:
      Name:
        Fn::Sub: ${AWS::StackName}-api
      StageName:
        Ref: EnvironmentName
      MethodSettings:
        - HttpMethod: POST
          ResourcePath: /~1features~1data-spaces~1public-read
          ThrottlingRateLimit: 25
          ThrottlingBurstLimit: 50
      Tags:
        Project: Zoolandingpage
        Component: DataSpaces
        ManagedBy: SAM
        Environment:
          Ref: EnvironmentName

  DataSpacesApiIdParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name:
        Fn::Sub: /zoolanding/${EnvironmentName}/services/data-spaces/api-id
      Type: String
      Value:
        Ref: DataSpacesApi

  DataSpacesTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      Tags:
        - Key: Project
          Value: Zoolandingpage
        - Key: Component
          Value: DataSpaces
        - Key: ManagedBy
          Value: SAM
        - Key: Environment
          Value:
            Ref: EnvironmentName

  ProtectedReadFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: handlers.protected_read.lambda_handler
      Description: Serves authenticated data-space read operations.
      Environment:
        Variables:
          DATA_SPACES_TABLE_NAME:
            Ref: DataSpacesTable
          CONFIG_REGISTRY_TABLE_NAME:
            Ref: ConfigRegistryTableName
          CONFIG_PAYLOADS_BUCKET_NAME:
            Ref: ConfigPayloadsBucketName
          AUTH_SESSION_TABLE_NAME:
            Ref: AuthSessionTableName
          AUTH_USER_STATE_TABLE_NAME:
            Ref: AuthUserStateTableName
          ENVIRONMENT_NAME:
            Ref: EnvironmentName
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:Query
              Resource:
                Fn::GetAtt:
                  - DataSpacesTable
                  - Arn
            - Effect: Allow
              Action:
                - dynamodb:GetItem
              Resource:
                - Fn::Sub: arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ConfigRegistryTableName}
                - Fn::Sub: arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AuthSessionTableName}
                - Fn::Sub: arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AuthUserStateTableName}
            - Effect: Allow
              Action:
                - s3:GetObject
              Resource:
                - Fn::Sub: arn:${AWS::Partition}:s3:::${ConfigPayloadsBucketName}/sites/*/versions/*/*/server/data-spaces.json
                - Fn::Sub: arn:${AWS::Partition}:s3:::${ConfigPayloadsBucketName}/sites/*/versions/*/*/server/auth-profile-registry.json
      Events:
        ProtectedRead:
          Type: Api
          Properties:
            RestApiId:
              Ref: DataSpacesApi
            Path: /features/data-spaces/read
            Method: POST

  ProtectedActionFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: handlers.protected_action.lambda_handler
      Description: Applies authenticated data-space mutations.
      Environment:
        Variables:
          DATA_SPACES_TABLE_NAME:
            Ref: DataSpacesTable
          CONFIG_REGISTRY_TABLE_NAME:
            Ref: ConfigRegistryTableName
          CONFIG_PAYLOADS_BUCKET_NAME:
            Ref: ConfigPayloadsBucketName
          AUTH_SESSION_TABLE_NAME:
            Ref: AuthSessionTableName
          AUTH_USER_STATE_TABLE_NAME:
            Ref: AuthUserStateTableName
          ENVIRONMENT_NAME:
            Ref: EnvironmentName
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:Query
                - dynamodb:TransactWriteItems
              Resource:
                Fn::GetAtt:
                  - DataSpacesTable
                  - Arn
            - Effect: Allow
              Action:
                - dynamodb:GetItem
              Resource:
                - Fn::Sub: arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ConfigRegistryTableName}
                - Fn::Sub: arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AuthSessionTableName}
                - Fn::Sub: arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AuthUserStateTableName}
            - Effect: Allow
              Action:
                - s3:GetObject
              Resource:
                - Fn::Sub: arn:${AWS::Partition}:s3:::${ConfigPayloadsBucketName}/sites/*/versions/*/*/server/data-spaces.json
                - Fn::Sub: arn:${AWS::Partition}:s3:::${ConfigPayloadsBucketName}/sites/*/versions/*/*/server/auth-profile-registry.json
      Events:
        ProtectedAction:
          Type: Api
          Properties:
            RestApiId:
              Ref: DataSpacesApi
            Path: /features/data-spaces/action
            Method: POST

  PublicReadFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: handlers.public_read.lambda_handler
      Description: Serves explicitly published public data-space records.
      Environment:
        Variables:
          DATA_SPACES_TABLE_NAME:
            Ref: DataSpacesTable
          CONFIG_REGISTRY_TABLE_NAME:
            Ref: ConfigRegistryTableName
          CONFIG_PAYLOADS_BUCKET_NAME:
            Ref: ConfigPayloadsBucketName
          ENVIRONMENT_NAME:
            Ref: EnvironmentName
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:Query
              Resource:
                Fn::GetAtt:
                  - DataSpacesTable
                  - Arn
            - Effect: Allow
              Action:
                - dynamodb:GetItem
              Resource:
                Fn::Sub: arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ConfigRegistryTableName}
            - Effect: Allow
              Action:
                - s3:GetObject
              Resource:
                Fn::Sub: arn:${AWS::Partition}:s3:::${ConfigPayloadsBucketName}/sites/*/versions/*/*/server/data-spaces.json
      Events:
        PublicRead:
          Type: Api
          Properties:
            RestApiId:
              Ref: DataSpacesApi
            Path: /features/data-spaces/public-read
            Method: POST

  InternalSnapshotReadFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: handlers.internal_snapshot_read.lambda_handler
      Description: Returns one immutable record snapshot to authorized AWS callers.
      Environment:
        Variables:
          DATA_SPACES_TABLE_NAME:
            Ref: DataSpacesTable
          CONFIG_REGISTRY_TABLE_NAME:
            Ref: ConfigRegistryTableName
          CONFIG_PAYLOADS_BUCKET_NAME:
            Ref: ConfigPayloadsBucketName
          ENVIRONMENT_NAME:
            Ref: EnvironmentName
          INTERNAL_SNAPSHOT_CALLER_ROLE_ARN:
            Ref: InternalSnapshotCallerRoleArn
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
              Resource:
                Fn::GetAtt:
                  - DataSpacesTable
                  - Arn
            - Effect: Allow
              Action:
                - dynamodb:GetItem
              Resource:
                Fn::Sub: arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ConfigRegistryTableName}
            - Effect: Allow
              Action:
                - s3:GetObject
              Resource:
                Fn::Sub: arn:${AWS::Partition}:s3:::${ConfigPayloadsBucketName}/sites/*/versions/*/*/server/data-spaces.json
      Events:
        InternalSnapshotRead:
          Type: Api
          Properties:
            RestApiId:
              Ref: DataSpacesApi
            Path: /internal/v1/data-spaces/record-snapshot
            Method: POST
            Auth:
              Authorizer: AWS_IAM

  Api5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Data Spaces API returned a server error.
      Namespace: AWS/ApiGateway
      MetricName: 5XXError
      Dimensions:
        - Name: ApiName
          Value:
            Fn::Sub: ${AWS::StackName}-api
        - Name: Stage
          Value:
            Ref: EnvironmentName
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - Ref: AlarmTopicArn

  ApiLatencyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Data Spaces API latency exceeded the operational target.
      Namespace: AWS/ApiGateway
      MetricName: Latency
      Dimensions:
        - Name: ApiName
          Value:
            Fn::Sub: ${AWS::StackName}-api
        - Name: Stage
          Value:
            Ref: EnvironmentName
      ExtendedStatistic: p95
      Period: 60
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 3000
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - Ref: AlarmTopicArn

  ProtectedReadErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Protected read Lambda returned an error.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value:
            Ref: ProtectedReadFunction
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - Ref: AlarmTopicArn

  ProtectedReadDurationAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Protected read Lambda duration approached its timeout.
      Namespace: AWS/Lambda
      MetricName: Duration
      Dimensions:
        - Name: FunctionName
          Value:
            Ref: ProtectedReadFunction
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 8000
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - Ref: AlarmTopicArn

  ProtectedReadThrottlesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Protected read Lambda was throttled.
      Namespace: AWS/Lambda
      MetricName: Throttles
      Dimensions:
        - Name: FunctionName
          Value:
            Ref: ProtectedReadFunction
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - Ref: AlarmTopicArn

  ProtectedActionErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Protected action Lambda returned an error.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value:
            Ref: ProtectedActionFunction
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - Ref: AlarmTopicArn

  ProtectedActionDurationAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Protected action Lambda duration approached its timeout.
      Namespace: AWS/Lambda
      MetricName: Duration
      Dimensions:
        - Name: FunctionName
          Value:
            Ref: ProtectedActionFunction
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 8000
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - Ref: AlarmTopicArn

  ProtectedActionThrottlesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Protected action Lambda was throttled.
      Namespace: AWS/Lambda
      MetricName: Throttles
      Dimensions:
        - Name: FunctionName
          Value:
            Ref: ProtectedActionFunction
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - Ref: AlarmTopicArn

  PublicReadErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Public read Lambda returned an error.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value:
            Ref: PublicReadFunction
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - Ref: AlarmTopicArn

  PublicReadDurationAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Public read Lambda duration approached its timeout.
      Namespace: AWS/Lambda
      MetricName: Duration
      Dimensions:
        - Name: FunctionName
          Value:
            Ref: PublicReadFunction
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 8000
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - Ref: AlarmTopicArn

  PublicReadThrottlesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Public read Lambda was throttled.
      Namespace: AWS/Lambda
      MetricName: Throttles
      Dimensions:
        - Name: FunctionName
          Value:
            Ref: PublicReadFunction
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - Ref: AlarmTopicArn

  InternalSnapshotReadErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Internal snapshot read Lambda returned an error.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value:
            Ref: InternalSnapshotReadFunction
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - Ref: AlarmTopicArn

  InternalSnapshotReadDurationAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Internal snapshot read Lambda duration approached its timeout.
      Namespace: AWS/Lambda
      MetricName: Duration
      Dimensions:
        - Name: FunctionName
          Value:
            Ref: InternalSnapshotReadFunction
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 8000
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - Ref: AlarmTopicArn

  InternalSnapshotReadThrottlesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Internal snapshot read Lambda was throttled.
      Namespace: AWS/Lambda
      MetricName: Throttles
      Dimensions:
        - Name: FunctionName
          Value:
            Ref: InternalSnapshotReadFunction
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - Ref: AlarmTopicArn

  TestLiveMismatchAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Published Data Spaces policy environment did not match the deployed environment.
      Namespace: Zoolanding/DataSpaces
      MetricName: TestLiveMismatch
      Dimensions:
        - Name: Environment
          Value:
            Ref: EnvironmentName
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - Ref: AlarmTopicArn

Outputs:
  DataSpacesApiId:
    Description: Data Spaces REST API identifier.
    Value:
      Ref: DataSpacesApi
  DataSpacesApiIdParameterName:
    Description: SSM parameter that publishes the Data Spaces REST API identifier.
    Value:
      Ref: DataSpacesApiIdParameter
  ApiUrl:
    Description: Data Spaces API base URL.
    Value:
      Fn::Sub: https://${DataSpacesApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${EnvironmentName}
  TableName:
    Description: Data Spaces DynamoDB table name.
    Value:
      Ref: DataSpacesTable
